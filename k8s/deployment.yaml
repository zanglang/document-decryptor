apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-decryptor
  labels:
    app: document-decryptor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-decryptor
  template:
    metadata:
      labels:
        app: document-decryptor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: document-decryptor
          image: document-decryptor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /config/patterns.json
            - name: LISTEN_ADDR
              value: ":8080"
            - name: MAX_UPLOAD_BYTES
              value: "10485760"
            - name: QPDF_TIMEOUT_SECONDS
              value: "30"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: decryptor-config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: decryptor-config
          secret:
            secretName: document-decryptor-config
        - name: tmp
          emptyDir: {}
